{% load static %}
<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>{% block title %}IMS Mobile{% endblock %}</title>
    <link rel="manifest" href="{% url 'mobile:manifest' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/default-logo.svg' %}">
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}?v={{ app_version }}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}?v={{ app_version }}" rel="stylesheet">
    <link href="{% static 'mobile/css/mobile.css' %}?v={{ app_version }}" rel="stylesheet">
</head>
<body class="mobile-shell">
    <header class="mobile-topbar">
        <a class="mobile-brand" href="{% url 'mobile:stock_list' %}">
            <img src="{% static 'img/default-logo.svg' %}" alt="" aria-hidden="true">
            <span>IMS Mobile</span>
        </a>
        <a class="mobile-topbar__link" href="{% url 'dashboard' %}">Desktop</a>
    </header>

    <main class="mobile-main">
        {% if messages %}
        <div class="mobile-messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} mb-2">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        <section class="mobile-install" data-pwa-install hidden>
            <div class="mobile-install__icon" aria-hidden="true">
                <i class="bi bi-phone"></i>
            </div>
            <div class="mobile-install__body">
                <h2>Pasang IMS Mobile</h2>
                <p data-pwa-install-text>Tambahkan ke layar utama agar akses cek stok lebih cepat.</p>
            </div>
            <div class="mobile-install__actions">
                <button type="button" class="mobile-install__primary" data-pwa-install-button hidden>Pasang</button>
                <button type="button" class="mobile-install__dismiss" data-pwa-install-dismiss aria-label="Tutup">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </section>
        {% block content %}{% endblock %}
    </main>

    <nav class="mobile-bottom-nav" aria-label="Navigasi mobile">
        <a href="{% url 'mobile:stock_list' %}" class="{% if request.resolver_match.url_name == 'stock_list' or request.resolver_match.url_name == 'stock_card' %}active{% endif %}">
            <i class="bi bi-boxes"></i>
            <span>Stok</span>
        </a>
    </nav>

    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}?v={{ app_version }}"></script>
    <script src="{% static 'mobile/js/mobile.js' %}?v={{ app_version }}"></script>
</body>
</html>
