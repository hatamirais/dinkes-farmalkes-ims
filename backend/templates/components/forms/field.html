<div class="ims-form-field"{% if field.name == 'program' %} data-program-field{% endif %}{% if field.name == 'facility' %} data-facility-field{% endif %}>
    <div class="ims-form-label-row">
        <label for="{{ field.id_for_label }}" class="ims-label">{{ field.label }}</label>
        {% if quick_create_target %}
        <button type="button" class="ims-btn ims-btn--secondary ims-btn--sm" data-bs-toggle="modal" data-bs-target="{{ quick_create_target }}">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>{{ quick_create_label }}
        </button>
        {% endif %}
    </div>
    {{ widget }}
    {% if field.help_text %}<div id="{{ field.auto_id }}_helptext" class="ims-help">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div id="{{ field.auto_id }}_errors" class="ims-error">{% for error in field.errors %}<div>{{ error }}</div>{% endfor %}</div>{% endif %}
</div>
